[package]
name = "hbmgr"
version = "1.1.0"
edition = "2024"
description = "Homebridge QPKG backend: CGI, background jobs and CLI for Homebridge containers on QNAP QTS"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hbmgr"
path = "src/main.rs"

[dependencies]
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

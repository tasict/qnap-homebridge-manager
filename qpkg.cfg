# Homebridge QPKG configuration (QDK). See QDK's template/qpkg.cfg for every key.
QPKG_NAME="Homebridge"
QPKG_DISPLAY_NAME="Homebridge"
QPKG_VER="1.1.0"
QPKG_AUTHOR="tasict"
QPKG_SUMMARY="Manage several Homebridge containers on the NAS: own LAN address each, folders, upgrades with rollback"

# Preferred number in the start/stop sequence (after Container Station, 101).
QPKG_RC_NUM="102"
# Init script that starts and stops the package. It only publishes the web UI:
# the containers run on their own restart policy and are never stopped by it.
QPKG_SERVICE_PROGRAM="Homebridge.sh"

# Relative path to the web interface, on the QTS admin port
QPKG_WEBUI="/Homebridge/"
QPKG_WEB_PORT="-1"
# Do not use QTS automatic reverse proxy
QPKG_USE_PROXY="0"
# Open the web interface inside the QTS desktop
QPKG_DESKTOP_APP="1"
# The containers run on Container Station's Docker
QPKG_REQUIRE="container-station"
QTS_MINI_VERSION="5.0.0"

# Location of icons for the packaged application.
QDK_DATA_DIR_ICONS="icons"
# Location of files common to all architectures.
QDK_DATA_DIR_SHARED="shared"
# The statically linked backend (bin/hbmgr)
QDK_DATA_DIR_X86_64="x86_64"

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<title>Homebridge</title>
	<link rel="icon" type="image/svg+xml" href="img/mark.svg">
	<link rel="icon" type="image/png" sizes="64x64" href="img/mark-64.png">
	<link rel="apple-touch-icon" href="img/mark-180.png">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/theme.js"></script>
	<script src="js/core.js" defer></script>
	<script src="js/i18n.js" defer></script>
	<script src="js/ui.js" defer></script>
	<script src="js/house.js" defer></script>
	<script src="js/jobs.js" defer></script>
	<script src="js/folders.js" defer></script>
	<script src="js/specform.js" defer></script>
	<script src="js/wizard.js" defer></script>
	<script src="js/actions.js" defer></script>
	<script src="js/drawer.js" defer></script>
	<script src="js/street.js" defer></script>
	<script src="js/app.js" defer></script>
</head>
<body>
	<a class="skip" href="#main" data-t="Skip to the main content">Skip to the main content</a>
	<header class="topbar" id="topbar">
		<a class="brand" href="#/" data-t-aria-label="Homebridge home" aria-label="Homebridge">
			<img class="brand-mark" src="img/mark.svg" alt="" width="30" height="30">
			<span class="brand-name">Homebridge</span>
		</a>
		<div class="topbar-tools" id="topbarTools" hidden>
			<div class="update-state" id="updateState" aria-live="polite"></div>
			<button type="button" class="btn btn-quiet btn-sm" id="checkUpdates"></button>
			<button type="button" class="icon-btn" id="openSettings"></button>
			<button type="button" class="icon-btn" id="themeToggle"></button>
		</div>
	</header>

	<main id="main" class="main" tabindex="-1"></main>

	<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
